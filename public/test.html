<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wheel test controller</title><link rel="stylesheet" href="/style.css"><style>main{max-width:600px;margin:2rem auto;padding:1rem}input,button,select{font:inherit;padding:.65rem}button{cursor:pointer}#result{white-space:pre-wrap;margin-top:2rem}</style></head><body><main><h1>Wheel test controller</h1><p>Runs the actual exhibition wheel animation without saving submissions, answers, or Jackpot choices. Testing is blocked while visitors are waiting or playing.</p><form id="login"><label>Test password <input id="password" type="password" required></label><button>Unlock</button></form><section id="controls" hidden><label for="prize">Prize</label><select id="prize"></select><p><button id="spin">Test selected prize</button> <button id="next">Next prize</button></p><p id="status" role="status"></p><div id="result"></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(), prizes=[['gossip','Random gossip'],['free','Free spin'],['balloon','Murmurs and Whispers'],['judgement','Oops'],['notification','Talking heads'],['ohno','Oh no'],['jackpot','Jackpot'],['lore','Gossip lore'],['gossip2','Random gossip (second segment)'],['questions','???'],['refund','Get your money back'],['sacrifice','Sacrificial lamb']];
const select=document.getElementById('prize'),status=document.getElementById('status'),controls=document.getElementById('controls'),login=document.getElementById('login'),spin=document.getElementById('spin'),next=document.getElementById('next'),result=document.getElementById('result');
for(const [id,label] of prizes){const o=document.createElement('option');o.value=id;o.textContent=label;select.append(o)}
login.addEventListener('submit',e=>{e.preventDefault();socket.emit('test-login',{password:document.getElementById('password').value},r=>{if(!r.ok)return status.textContent=r.error;login.hidden=true;controls.hidden=false;document.getElementById('password').value=''})});
function test(){spin.disabled=true;next.disabled=true;result.textContent='';status.textContent='Spinning…';socket.emit('test-spin',{prizeId:select.value},r=>{if(!r.ok){status.textContent=r.error;spin.disabled=false;next.disabled=false}})}
spin.addEventListener('click',test);next.addEventListener('click',()=>{select.selectedIndex=(select.selectedIndex+1)%select.options.length;test()});
socket.on('test-result',r=>{status.textContent='Simulation complete';result.textContent=r.label+'\n\n'+r.message;spin.disabled=false;next.disabled=false});
socket.on('disconnect',()=>{login.hidden=false;controls.hidden=true;status.textContent='Disconnected. Log in again.'});
</script></body></html>
