<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gossip moderation</title><link rel="stylesheet" href="/style.css"><style>main{max-width:750px;margin:2rem auto;padding:1rem}input,button{font:inherit;padding:.6rem}article{border:1px solid #aaa;padding:1rem;margin:1rem 0;overflow-wrap:anywhere}button{margin-right:.5rem;cursor:pointer}small{display:block;color:#555}#message{min-height:1.5em}</style></head><body><main><h1>Gossip moderation</h1><form id="login"><label>Admin password <input id="password" type="password" required autocomplete="current-password"></label><button>Unlock</button></form><section id="dashboard" hidden><button id="refresh">Refresh submissions</button><h2>Today's special Jackpot</h2>
<p>Paste the featured story here. It will be available only on the selected Texas date, until the first Jackpot is awarded. Afterward, the five-approved-submissions rule applies.</p>
<form id="special-form"><label for="special-date">Exhibition date (Texas)</label> <input id="special-date" type="date" required><p><label for="special-text">Featured Jackpot story</label></p><textarea id="special-text" rows="10" style="width:100%;box-sizing:border-box;font:inherit" required></textarea><p><button type="submit">Save featured Jackpot</button></p></form>
<h2>Pending gossip</h2><div id="pending"></div><h2>Reviewed gossip</h2><div id="reviewed"></div><h2>Question answers (not published)</h2><div id="answers"></div></section><p id="message" role="status"></p></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(), login=document.getElementById('login'), dashboard=document.getElementById('dashboard'), message=document.getElementById('message');
let unlocked=false;
function notice(text){message.textContent=text}
login.addEventListener('submit',e=>{e.preventDefault();socket.emit('admin-login',{password:document.getElementById('password').value},r=>{if(!r.ok)return notice(r.error);unlocked=true;login.hidden=true;dashboard.hidden=false;document.getElementById('password').value='';refresh()})});
socket.on('disconnect',()=>{unlocked=false;login.hidden=false;dashboard.hidden=true;notice('Connection lost. Please log in again.')});
function refresh(){if(!unlocked)return;socket.emit('admin-list',{},r=>{if(!r.ok)return notice(r.error);notice('');for(const id of ['pending','reviewed','answers'])document.getElementById(id).replaceChildren();for(const entry of r.submissions){const card=document.createElement('article'),meta=document.createElement('small'),p=document.createElement('p');meta.textContent=entry.kind+' · '+new Date(entry.submittedAt).toLocaleString()+' · '+entry.status+(entry.withheldByJackpot?' · Jackpot withheld':'');p.textContent=entry.text;card.append(meta,p);for(const status of ['approved','rejected']){const b=document.createElement('button');b.textContent=status==='approved'?'Approve':'Reject';b.disabled=entry.status===status;b.addEventListener('click',()=>socket.emit('admin-review',{id:entry.id,status},response=>{if(response.ok)refresh();else notice(response.error)}));card.append(b)}document.getElementById(entry.status==='pending'?'pending':'reviewed').append(card)}for(const entry of r.answers){const card=document.createElement('article'),meta=document.createElement('small'),p=document.createElement('p');meta.textContent=new Date(entry.submittedAt).toLocaleString();p.textContent=entry.text;card.append(meta,p);document.getElementById('answers').append(card)}if(!r.submissions.length)document.getElementById('pending').textContent='No submissions yet.'})}
document.getElementById('special-date').value = '2026-11-14';
document.getElementById('special-form').addEventListener('submit',e=>{
  e.preventDefault();
  socket.emit('admin-special-jackpot', {
    date: document.getElementById('special-date').value,
    text: document.getElementById('special-text').value
  }, r => notice(r.ok ? 'Featured Jackpot saved.' : r.error));
});
document.getElementById('refresh').addEventListener('click',refresh);
</script></body></html>
